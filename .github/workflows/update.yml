name: Update Stundenplan

on:
  schedule:
    - cron: '0 4 * * *'   # täglich ca. 5/6 Uhr deutscher Zeit
  workflow_dispatch:       # manuelles Triggern aus der Actions-UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 icalendar

      - name: Generate ICS
        env:
          RAPLA_URL: ${{ secrets.RAPLA_URL }}
        run: python rapla_to_ics.py "$RAPLA_URL" -o stundenplan.ics --exclude-file exclude.txt

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stundenplan.ics
          git diff --cached --quiet || git commit -m "Update Stundenplan ($(date -u +%Y-%m-%d))"
          git push
